<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCM Tracker</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

button,input,select{font:inherit}

button{
  cursor:pointer;
  border:0;
}

.header{
  background:#111827;
  color:white;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

h1,h2,h3{
  margin-top:0;
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:10px;
  margin:6px 0 12px;
  outline:none;
  background:white;
}

input:focus,select:focus{
  border-color:#2563eb;
}

.btn{
  background:#2563eb;
  color:white;
  padding:12px 16px;
  border-radius:10px;
  font-weight:700;
}

.btn:hover{
  opacity:.9;
}

.btn-danger{
  background:#dc2626;
}

.hidden{
  display:none!important;
}

.auth{
  max-width:430px;
  margin:60px auto;
}

.switch{
  color:#2563eb;
  cursor:pointer;
  font-weight:700;
}

.message{
  padding:11px;
  border-radius:10px;
  margin-bottom:12px;
  display:none;
}

.message.error{
  display:block;
  color:#991b1b;
  background:#fef2f2;
}

.message.success{
  display:block;
  color:#166534;
  background:#f0fdf4;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.stat{
  background:#f8fafc;
  padding:18px;
  border-radius:14px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:25px;
  margin-top:5px;
}

.progress-wrap{
  height:13px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  background:#2563eb;
  width:0%;
  transition:.3s;
}

.subject{
  margin-bottom:25px;
}

.paper{
  margin-bottom:20px;
}

.chapter{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px;
  border:1px solid #e5e7eb;
  border-radius:12px;
  margin:8px 0;
  background:white;
}

.chapter-name{
  flex:1;
}

.chapter select{
  width:160px;
  margin:0;
}

.gpa-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.loading{
  text-align:center;
  padding:40px;
}

@media(max-width:700px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .chapter{
    flex-direction:column;
    align-items:stretch;
  }

  .chapter select{
    width:100%;
  }

  .gpa-grid{
    grid-template-columns:1fr;
  }

}
</style>
</head>

/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type="error"){

  const box =
  document.getElementById("authMessage");

  box.className =
  "message "+type;

  box.textContent =
  text;

}


/* =====================================================
   LOGIN / SIGNUP SWITCH
===================================================== */

window.toggleAuth=function(){

  signupMode =
  !signupMode;

  document.getElementById("authTitle")
  .textContent =
  signupMode
  ? "Create Account"
  : "Login";

  document.getElementById("authBtn")
  .textContent =
  signupMode
  ? "Sign Up"
  : "Login";

  document.getElementById("signupFields")
  .classList
  .toggle(
    "hidden",
    !signupMode
  );

  document.getElementById("switchText")
  .textContent =
  signupMode
  ? "Already have an account?"
  : "Don't have an account?";

  document.getElementById("switchBtn")
  .textContent =
  signupMode
  ? " Login"
  : " Sign Up";

  document.getElementById("authMessage")
  .className="message";

  document.getElementById("authMessage")
  .textContent="";

};


/* =====================================================
   SIGNUP / LOGIN
===================================================== */

window.authAction=async function(){

  const email =
  document.getElementById("email")
  .value
  .trim();

  const password =
  document.getElementById("password")
  .value;


  if(!email || !password){

    showMessage(
      "Email and password required."
    );

    return;
  }


  if(password.length<6){

    showMessage(
      "Password must be at least 6 characters."
    );

    return;
  }


  try{

    /* ================= SIGNUP ================= */

    if(signupMode){

      const batch =
      document.getElementById("batch")
      .value;

      const college =
      document.getElementById("college")
      .value
      .trim();

      const zilla =
      document.getElementById("zilla")
      .value
      .trim();


      if(!college || !zilla){

        showMessage(
          "College and Zilla are required."
        );

        return;
      }


      const {
        data,
        error
      } =
      await db.auth.signUp({

        email:email,

        password:password

      });


      if(error)
        throw error;


      if(data.session){

        await saveProfile(
          data.user,
          batch,
          college,
          zilla
        );

        showMessage(
          "Account created successfully!",
          "success"
        );

      }else{

        showMessage(
          "Account created. Please verify your email, then Login.",
          "success"
        );

      }


    }

    /* ================= LOGIN ================= */

    else{

      const {
        data,
        error
      } =
      await db.auth.signInWithPassword({

        email:email,

        password:password

      });


      if(error)
        throw error;


      if(data.user){

        await loadUser(
          data.user
        );

      }

    }


  }catch(error){

    console.error(error);

    let message =
    error.message || "Something went wrong.";

    if(
      message
      .toLowerCase()
      .includes("invalid login credentials")
    ){

      message =
      "Wrong email or password.";

    }

    else if(
      message
      .toLowerCase()
      .includes("already registered")
    ){

      message =
      "This email is already registered. Please Login.";

    }

    showMessage(message);

  }

};


/* =====================================================
   SAVE PROFILE
===================================================== */

async function saveProfile(
  user,
  batch,
  college,
  zilla
){

  const profile={

    id:user.id,

    email:user.email,

    batch:batch,

    college:college,

    zilla:zilla,

    progress:{},

    history:[]

  };


  const {
    error
  } =
  await db
  .from("profiles")
  .upsert(
    profile,
    {
      onConflict:"id"
    }
  );


  if(error)
    throw error;


  userData =
  profile;

}


/* =====================================================
   LOAD USER
===================================================== */

async function loadUser(user){

  currentUser =
  user;


  let {
    data,
    error
  } =
  await db
  .from("profiles")
  .select("*")
  .eq("id",user.id)
  .maybeSingle();


  if(error)
    throw error;


  /* If profile doesn't exist */

  if(!data){

    const newProfile={

      id:user.id,

      email:user.email,

      batch:"HSC 27",

      college:"",

      zilla:"",

      progress:{},

      history:[]

    };


    const result =
    await db
    .from("profiles")
    .insert(newProfile)
    .select()
    .single();


    if(result.error)
      throw result.error;


    data =
    result.data;

  }


  userData =
  data;


  document
  .getElementById("authPage")
  .classList
  .add("hidden");


  document
  .getElementById("app")
  .classList
  .remove("hidden");


  renderProfile();

  renderSyllabus();

  updateDashboard();

}

   AUTH STATE
===================================================== */

      try{

        await loadUser(
          session.user
        );

      }catch(error){

        console.error(error);

        showMessage(

          error.message

    }else{

      currentUser=null;

      userData=null;

      document
      .getElementById("authPage")
      .classList
      .remove("hidden");

      document
      .getElementById("app")
      .classList
      .add("hidden");

    }

  }
);

/* =====================================================
   RENDER SYLLABUS
===================================================== */

function renderSyllabus(){

  const box =
  document.getElementById("syllabus");

  box.innerHTML="";


  Object.entries(syllabus)
  .forEach(
    ([subject,papers])=>{

      const subjectBox =
      document.createElement("div");

      subjectBox.className=
      "subject";


      const title =
      document.createElement("h2");

      title.textContent=
      subject;

      subjectBox.appendChild(title);


      Object.entries(papers)
      .forEach(
        ([paper,chapters])=>{

          const paperBox =
          document.createElement("div");

          paperBox.className=
          "paper";


          const paperTitle =
          document.createElement("h3");

          paperTitle.textContent=
          paper;

          paperBox.appendChild(
            paperTitle
          );


          chapters.forEach(
            (chapter,index)=>{

              const key =
              subject+
              "|"+
              paper+
              "|"+
              index;


              const row =
              document.createElement("div");

              row.className=
              "chapter";


              const name =
              document.createElement("div");

              name.className=
              "chapter-name";

              name.textContent=
              (index+1)+
              ". "+
              chapter;


              const select =
              document.createElement("select");


              select.innerHTML=`

                <option value="not_started">
                  Not Started
                </option>

                <option value="running">
                  Running
                </option>

                <option value="done">
                  Done
                </option>

              `;


              select.value =
              userData.progress?.[key]
              ||
              "not_started";


              select.onchange=()=>{
                changeProgress(
                  key,
                  select.value
                );
              };


              row.appendChild(name);

              row.appendChild(select);

              paperBox.appendChild(row);

            }
          );


          subjectBox.appendChild(
            paperBox
          );

        }
      );


      box.appendChild(
        subjectBox
      );

    }
  );

}


/* =====================================================
   CHANGE PROGRESS
===================================================== */

async function changeProgress(
  key,
  status
){

  if(!userData)
    return;


  userData.progress =
  userData.progress || {};

  userData.history =
  userData.history || [];


  const old =
  userData.progress[key]
  ||
  "not_started";


  /* Record completion */

  if(
    old!=="done" &&
    status==="done"
  ){

    userData.history.push({

      time:
      Date.now(),

      key:key

    });

  }


  userData.progress[key]=
  status;


  const {
    error
  } =
  await db
  .from("profiles")
  .update({

    progress:
    userData.progress,

    history:
    userData.history,

    updated_at:
    new Date().toISOString()

  })
  .eq(
    "id",
    currentUser.id
  );


  if(error){

    alert(
      "Progress could not be saved:\n\n"+
      error.message
    );

    renderSyllabus();

    return;

  }


  updateDashboard();

}


/* =====================================================
   DASHBOARD
===================================================== */

function updateDashboard(){

  let total=0;

  let done=0;


  Object.values(syllabus)
  .forEach(papers=>{

    Object.values(papers)
    .forEach(chapters=>{

      total +=
      chapters.length;

    });

  });


  Object.values(
    userData.progress || {}
  )
  .forEach(status=>{

    if(status==="done")
      done++;

  });


  const percent =
  total
  ? Math.round(
      done/total*100
    )
  : 0;


  document
  .getElementById("overall")
  .textContent =
  percent+"%";


  document
  .getElementById("overallBar")
  .style.width =
  percent+"%";


  document
  .getElementById("doneCount")
  .textContent =
  done;


  const now =
  Date.now();


  const history =
  userData.history || [];


  const seven =
  history.filter(
    item =>
    now-item.time
    <=
    7*24*60*60*1000
  ).length;


  const thirty =
  history.filter(
    item =>
    now-item.time
    <=
    30*24*60*60*1000
  ).length;


  document
  .getElementById("sevenDays")
  .textContent =
  seven;


  document
  .getElementById("thirtyDays")
  .textContent =
  thirty;

}


/* =====================================================
   GPA
===================================================== */

window.calculateGPA=function(){

  const ids=[

    "gBangla",
    "gEnglish",
    "gICT",
    "gPhysics",
    "gChemistry",
    "gMath"

  ];


  const values =
  ids.map(
    id =>
    Number(
      document
      .getElementById(id)
      .value
    )
  );


  if(
    values.some(
      value =>
      isNaN(value) ||
      value<0 ||
      value>5
    )
  ){

    document
    .getElementById("gpaResult")
    .textContent =
    "Enter all 6 main subject GPAs.";

    return;

  }


  let total =
  values.reduce(
    (a,b)=>a+b,
    0
  );


  const biology =
  Number(
    document
    .getElementById("gBiology")
    .value
  );


  /* Optional Biology bonus */

  if(
    !isNaN(biology) &&
    biology>2
  ){

    total +=
    biology-2;

  }


  let gpa =
  total/6;


  gpa =
  Math.min(
    5,
    gpa
  );


  gpa =
  Math.round(
    gpa*100
  )/100;


  document
  .getElementById("gpaResult")
  .textContent =
  "Your GPA: "+
  gpa+
  "/5";

};
