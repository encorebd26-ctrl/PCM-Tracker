<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

button,input,select{font:inherit}
button{cursor:pointer;border:0}

.header{
  background:#111827;
  color:white;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

h1,h2,h3{
  margin-top:0;
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:10px;
  margin:6px 0 12px;
  outline:none;
  background:white;
}

input:focus,select:focus{
  border-color:#2563eb;
}

.btn{
  background:#2563eb;
  color:white;
  padding:12px 16px;
  border-radius:10px;
  font-weight:700;
}

.btn:hover{
  opacity:.9;
}

.btn-danger{
  background:#dc2626;
}

.hidden{
  display:none!important;
}

.auth{
  max-width:430px;
  margin:60px auto;
}

.switch{
  color:#2563eb;
  cursor:pointer;
  font-weight:700;
}

.error{
  color:#dc2626;
  background:#fef2f2;
  border-radius:10px;
  padding:10px;
  margin-bottom:12px;
}

.success{
  color:#166534;
  background:#f0fdf4;
  border-radius:10px;
  padding:10px;
  margin-bottom:12px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.stat{
  background:#f8fafc;
  padding:18px;
  border-radius:14px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:25px;
  margin-top:5px;
}

.progress-wrap{
  height:13px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  background:#2563eb;
  width:0%;
  transition:.3s;
}

.subject{
  margin-bottom:25px;
}

.paper{
  margin-bottom:20px;
}

.chapter{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px;
  border:1px solid #e5e7eb;
  border-radius:12px;
  margin:8px 0;
  background:#fff;
}

.chapter-name{
  flex:1;
}

.chapter select{
  width:160px;
  margin:0;
}

.gpa-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

@media(max-width:700px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .chapter{
    flex-direction:column;
    align-items:stretch;
  }

  .chapter select{
    width:100%;
  }

  .gpa-grid{
    grid-template-columns:1fr;
  }

}
</style>

/* ================= MESSAGE ================= */

function showMessage(text,type="error"){

  const box =
  document.getElementById("authMessage");

  box.className =
  type==="success" ? "success" : "error";

  box.textContent = text;

}


/* ================= LOGIN / SIGNUP TOGGLE ================= */

window.toggleAuth = function(){

  signupMode = !signupMode;

  document.getElementById("authTitle").textContent =
  signupMode ? "Create Account" : "Login";

  document.getElementById("authBtn").textContent =
  signupMode ? "Sign Up" : "Login";

  document
  .getElementById("signupFields")
  .classList
  .toggle("hidden",!signupMode);

  document.getElementById("switchText").textContent =
  signupMode
  ? "Already have an account?"
  : "Don't have an account?";

  document.getElementById("switchBtn").textContent =
  signupMode
  ? " Login"
  : " Sign Up";

  document.getElementById("authMessage").textContent="";

};


/* ================= LOGIN / SIGNUP ================= */

window.authAction = async function(){

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value;

  if(!email || !password){

    showMessage(
      "Email and password required."
    );

    return;
  }


  try{

    if(signupMode){

      const batch =
      document.getElementById("batch").value;

      const college =
      document.getElementById("college").value.trim();

      const zilla =
      document.getElementById("zilla").value.trim();


      if(!college || !zilla){

        showMessage(
          "College and Zilla required."
        );

        return;
      }


      const result =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );


      await setDoc(
        doc(db,"users",result.user.uid),
        {

          uid:result.user.uid,

          email:email,

          batch:batch,

          college:college,

          zilla:zilla,

          progress:{},

          history:[],

          createdAt:
          serverTimestamp()

        }
      );


      showMessage(
        "Account created successfully!",
        "success"
      );


    }else{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }


  }catch(error){

    let msg = error.code || error.message;

    if(error.code==="auth/invalid-credential"){
      msg="Wrong email or password.";
    }

    else if(error.code==="auth/email-already-in-use"){
      msg="This email is already registered.";
    }

    else if(error.code==="auth/weak-password"){
      msg="Password should be at least 6 characters.";
    }

    else if(error.code==="auth/invalid-email"){
      msg="Invalid email address.";
    }

    showMessage(msg);

  }

};


/* ================= AUTH STATE ================= */

onAuthStateChanged(
  auth,
  async user=>{

    if(!user){

      currentUser=null;
      userData=null;

      document
      .getElementById("authPage")
      .classList
      .remove("hidden");

      document
      .getElementById("app")
      .classList
      .add("hidden");

      return;
    }


    currentUser=user;


    try{

      const ref =
      doc(db,"users",user.uid);

      const snap =
      await getDoc(ref);


      if(!snap.exists()){

        await setDoc(
          ref,
          {

            uid:user.uid,

            email:user.email,

            batch:"HSC 27",

            college:"",

            zilla:"",

            progress:{},

            history:[],

            createdAt:
            serverTimestamp()

          }
        );

        userData={
          uid:user.uid,
          email:user.email,
          batch:"HSC 27",
          college:"",
          zilla:"",
          progress:{},
          history:[]
        };

      }else{

        userData=snap.data();

      }


      document
      .getElementById("authPage")
      .classList
      .add("hidden");

      document
      .getElementById("app")
      .classList
      .remove("hidden");


      renderProfile();

      renderSyllabus();

      updateDashboard();


    }catch(error){

      showMessage(
        "Firebase error: "+error.message
      );

      console.error(error);

    }

  }
);

/* ================= RENDER SYLLABUS ================= */

function renderSyllabus(){

  const box =
  document.getElementById("syllabus");

  box.innerHTML="";


  Object.entries(syllabus)
  .forEach(
    ([subject,papers])=>{

      const subjectBox =
      document.createElement("div");

      subjectBox.className="subject";


      const subjectTitle =
      document.createElement("h2");

      subjectTitle.textContent=
      subject;

      subjectBox.appendChild(subjectTitle);


      Object.entries(papers)
      .forEach(
        ([paper,chapters])=>{

          const paperBox =
          document.createElement("div");

          paperBox.className="paper";


          const paperTitle =
          document.createElement("h3");

          paperTitle.textContent=
          paper;

          paperBox.appendChild(paperTitle);


          chapters.forEach(
            (chapter,index)=>{

              const key =
              subject+"|"+paper+"|"+index;


              const row =
              document.createElement("div");

              row.className="chapter";


              const name =
              document.createElement("div");

              name.className="chapter-name";

              name.textContent=
              (index+1)+". "+chapter;


              const select =
              document.createElement("select");

              select.innerHTML=`

                <option value="not_started">
                  Not Started
                </option>

                <option value="running">
                  Running
                </option>

                <option value="done">
                  Done
                </option>

              `;


              select.value =
              userData.progress?.[key]
              || "not_started";


              select.onchange =
              ()=>{
                changeProgress(
                  key,
                  select.value
                );
              };


              row.appendChild(name);

              row.appendChild(select);

              paperBox.appendChild(row);

            }
          );


          subjectBox.appendChild(paperBox);

        }
      );


      box.appendChild(subjectBox);

    }
  );

}


/* ================= CHANGE PROGRESS ================= */

async function changeProgress(
  key,
  status
){

  const old =
  userData.progress?.[key]
  || "not_started";


  userData.progress =
  userData.progress || {};

  userData.history =
  userData.history || [];


  /*
    Completion history:
    Every time a chapter becomes Done,
    save the date.
  */

  if(
    old!=="done" &&
    status==="done"
  ){

    userData.history.push({
      time:Date.now(),
      key:key
    });

  }


  userData.progress[key]=status;


  try{

    await updateDoc(
      doc(
        db,
        "users",
        currentUser.uid
      ),
      {

        progress:
        userData.progress,

        history:
        userData.history

      }
    );


    updateDashboard();

  }catch(error){

    alert(
      "Could not save progress.\n\n"+
      error.message
    );

    renderSyllabus();

  }

}


/* ================= DASHBOARD ================= */

function updateDashboard(){

  let total=0;

  let done=0;


  Object.values(syllabus)
  .forEach(papers=>{

    Object.values(papers)
    .forEach(chapters=>{

      total+=chapters.length;

    });

  });


  Object.values(
    userData.progress || {}
  )
  .forEach(status=>{

    if(status==="done"){
      done++;
    }

  });


  const percent =
  total
  ? Math.round(done/total*100)
  : 0;


  document
  .getElementById("overall")
  .textContent =
  percent+"%";


  document
  .getElementById("overallBar")
  .style.width =
  percent+"%";


  document
  .getElementById("doneCount")
  .textContent =
  done;


  const now=Date.now();


  const history =
  userData.history || [];


  const seven =
  history.filter(
    x =>
    now-x.time <=
    7*24*60*60*1000
  ).length;


  const thirty =
  history.filter(
    x =>
    now-x.time <=
    30*24*60*60*1000
  ).length;


  document
  .getElementById("sevenDays")
  .textContent =
  seven;


  document
  .getElementById("thirtyDays")
  .textContent =
  thirty;

}


/* ================= GPA ================= */

window.calculateGPA=function(){

  const ids=[
    "gBangla",
    "gEnglish",
    "gICT",
    "gPhysics",
    "gChemistry",
    "gMath"
  ];


  const values =
  ids.map(
    id =>
    Number(
      document
      .getElementById(id)
      .value
    )
  );


  if(
    values.some(
      x =>
      isNaN(x) ||
      x<0 ||
      x>5
    )
  ){

    document
    .getElementById("gpaResult")
    .textContent =
    "Enter all 6 main subject GPAs.";

    return;

  }


  let total =
  values.reduce(
    (a,b)=>a+b,
    0
  );


  const biology =
  Number(
    document
    .getElementById("gBiology")
    .value
  );


  /*
    Optional Biology:
    If Biology GPA > 2,
    bonus = Biology GPA - 2
  */

  if(
    !isNaN(biology) &&
    biology>2
  ){

    total +=
    biology-2;

  }


  let gpa =
  total/6;


  gpa =
  Math.min(
    5,
    gpa
  );


  gpa =
  Math.round(
    gpa*100
  )/100;


  document
  .getElementById("gpaResult")
  .textContent =
  "Your GPA: "+gpa+"/5";

};

</script>
