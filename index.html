<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PCM Tracker</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    select {
      padding: 9px 12px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
    }

    .hero {
      padding: 55px 6% 35px;
      background: white;
    }

    .hero small {
      color: #777;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .hero h1 {
      font-size: clamp(38px, 7vw, 70px);
      margin-top: 12px;
      line-height: 1;
    }

    .hero h1 span {
      color: #777;
    }

    .hero p {
      color: #666;
      max-width: 600px;
      margin-top: 18px;
      line-height: 1.6;
    }

    .progress-area {
      padding: 25px 6%;
      background: #111;
      color: white;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .progress-bar {
      height: 12px;
      background: #333;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #fff;
      transition: 0.3s;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 30px 20px 60px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .tab {
      padding: 12px 20px;
      border-radius: 9px;
      background: #ddd;
    }

    .tab.active {
      background: #111;
      color: white;
    }

    .paper {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
    }

    .paper button {
      padding: 9px 15px;
      border-radius: 8px;
      background: white;
      border: 1px solid #ddd;
    }

    .paper button.active {
      background: #222;
      color: white;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0;
    }

    .section-title h2 {
      font-size: 30px;
    }

    .reset {
      background: transparent;
      color: #b00020;
      border: 1px solid #b00020;
      padding: 8px 12px;
      border-radius: 7px;
    }

    .chapter {
      background: white;
      padding: 18px;
      margin-bottom: 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 15px;
      border: 2px solid transparent;
      transition: .2s;
    }

    .chapter:hover {
      transform: translateY(-2px);
    }

    .number {
      width: 42px;
      height: 42px;
      background: #eee;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #777;
    }

    .chapter-info {
      flex: 1;
    }

    .chapter-info h3 {
      font-size: 17px;
      margin-bottom: 4px;
    }

    .chapter-info p {
      font-size: 12px;
      color: #888;
    }

    .status {
      display: flex;
      gap: 5px;
    }

    .status button {
      width: 35px;
      height: 35px;
      border-radius: 8px;
      background: #eee;
      color: #777;
    }

    .status button.active {
      background: #111;
      color: white;
    }

    .chapter.done {
      border-color: #8bc48b;
      background: #f0fff0;
    }

    .chapter.progress {
      border-color: #e2c45a;
      background: #fffbed;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #888;
      border-top: 1px solid #ddd;
